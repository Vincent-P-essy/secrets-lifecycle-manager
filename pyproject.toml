[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secrets-lifecycle-manager"
version = "1.0.0"
description = "Secret rotation as a state machine with an overlap window: create, promote, verify, revoke — and it will not revoke the old version until consumers are shown to have migrated."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vincent Plessy" }]
keywords = ["secrets", "rotation", "vault", "credentials", "security", "pci-dss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["PyYAML>=5.4", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
slm = "slm.cli:main"

[project.urls]
Homepage = "https://github.com/Vincent-P-essy/secrets-lifecycle-manager"

[tool.hatch.build.targets.wheel]
packages = ["src/slm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
